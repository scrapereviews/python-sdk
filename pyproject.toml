[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapereviews"
version = "0.1.0"
description = "Official Python SDK for the ScrapeReviews API: Trustpilot companies, reviews and categories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ScrapeReviews" }]
keywords = ["trustpilot", "reviews", "ratings", "scraper", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.22.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/scrapereviews/python-sdk"
Homepage = "https://scrapereviews.com"
Documentation = "https://scrapereviews.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapereviews"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
